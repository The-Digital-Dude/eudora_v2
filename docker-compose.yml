services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: eudora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eudora_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eudora_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── API Service ─────────────────────────────────────────────────────────────
  api-service:
    build:
      context: ./services/api-service
      dockerfile: Dockerfile
    container_name: eudora_api
    restart: unless-stopped
    env_file:
      - ./services/api-service/.env.docker
    ports:
      - "3000:3000"
    volumes:
      # Under LOCAL storage every uploaded and generated file lives here. Without
      # this volume a rebuild wiped them all while their database rows survived,
      # leaving homework attachments, application CVs and generated narration as
      # rows pointing at files that no longer exist.
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
    driver: local
  api_uploads:
    driver: local
